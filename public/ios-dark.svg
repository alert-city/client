<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <style>
        .background { fill: #2C3E50; }
        .icon { stroke: #ECF0F1; stroke-width: 2.5; fill: none; }
        .filled { fill: #ECF0F1; }
    </style>

    <!-- Rounded rectangle background -->
    <rect class="background" x="10" y="10" width="100" height="100" rx="22" ry="22" />

    <!-- Original icon, scaled and centered -->
    <g transform="translate(20, 20) scale(0.8)">
        <path class="icon" d="M30,50 Q50,20 70,50 Q50,80 30,50 Z" />
        <circle class="filled" cx="30" cy="50" r="4" />
        <circle class="filled" cx="70" cy="50" r="4" />
    </g>
</svg>